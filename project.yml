name: OFFLINE
options:
  bundleIdPrefix: com.th07
  deploymentTarget:
    iOS: '17.0'
  createIntermediateGroups: true
  defaultConfig: Debug
packages:
  YouTubeKit:
    url: https://github.com/alexeichhorn/YouTubeKit.git
    version: 0.4.10
settings:
  base:
    SWIFT_VERSION: 5.9
    DEVELOPMENT_TEAM: ''
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ''
targets:
  OFFLINE:
    type: application
    platform: iOS
    deploymentTarget: '17.0'
    sources:
      - path: OFFLINE
        excludes: [Resources/Info.plist]
    resources: [OFFLINE/Resources/Assets.xcassets]
    info:
      path: OFFLINE/Resources/Info.plist
      properties:
        CFBundleDisplayName: Muzik Belesh
        CFBundleShortVersionString: '0.1.0'
        CFBundleVersion: '1'
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.th07.muzikbelesh
        TARGETED_DEVICE_FAMILY: '1'
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug: {SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG}
        Release: {SWIFT_OPTIMIZATION_LEVEL: -O}
    dependencies:
      - package: YouTubeKit
      - target: OFFLINEShareExtension
  OFFLINETests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: '17.0'
    sources: [Tests/Unit, Tests/Fixtures]
    dependencies: [{target: OFFLINE}]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.th07.muzikbelesh.tests
        GENERATE_INFOPLIST_FILE: YES
  OFFLINEShareExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: '17.0'
    sources:
      - path: OFFLINEShareExtension
        excludes: [Info.plist]
    info:
      path: OFFLINEShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Muzik Belesh
        CFBundlePackageType: 'XPC!'
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.th07.muzikbelesh.share
        TARGETED_DEVICE_FAMILY: '1'
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: OFFLINEShareExtension/Info.plist
    dependencies: []
schemes:
  OFFLINE:
    build:
      targets:
        OFFLINE: all
        OFFLINETests: [test]
        OFFLINEShareExtension: all
    test:
      targets: [OFFLINETests]
      gatherCoverageData: false

