name: Cleanup merged feature branches after v1.0.0
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-merged-feature-branches.yml'

permissions:
  contents: write

jobs:
  cleanup:
    if: github.repository == 'T-h07/MuzikBelesh'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify completed feature branches are already merged
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --no-tags
          branches=(
            'feature/phase-04-playback'
            'feature/phase-05-library'
            'feature/phase-06-youtube'
            'feature/phase-07-background-transfers'
            'feature/phase-07-downloads'
            'feature/phase-08-sharing'
            'feature/phase-09-release'
          )
          for branch in "${branches[@]}"; do
            sha=$(git rev-parse --verify "refs/remotes/origin/$branch")
            git merge-base --is-ancestor "$sha" "refs/remotes/origin/develop" || {
              echo "::error::Refusing to delete unmerged branch: $branch at $sha"; exit 1;
            }
            git merge-base --is-ancestor "$sha" "refs/remotes/origin/release" || {
              echo "::error::Refusing to delete branch absent from stable release: $branch at $sha"; exit 1;
            }
            printf 'Verified safe to remove: %s (%s)\n' "$branch" "$sha"
          done
          echo "All seven feature branches contain no commits missing from develop or release."
      - name: Delete only verified merged feature branch refs
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            'feature/phase-04-playback'
            'feature/phase-05-library'
            'feature/phase-06-youtube'
            'feature/phase-07-background-transfers'
            'feature/phase-07-downloads'
            'feature/phase-08-sharing'
            'feature/phase-09-release'
          )
          for branch in "${branches[@]}"; do
            case "$branch" in main|develop|release) echo "::error::Protected name"; exit 1;; esac
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/$branch" >/dev/null
            echo "Deleted merged branch $branch" >> "$GITHUB_STEP_SUMMARY"
          done
          for name in main develop release; do
            gh api "repos/${GITHUB_REPOSITORY}/branches/$name" --jq .name | grep -Fx "$name"
          done
