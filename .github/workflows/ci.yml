name: CI
on:
  pull_request: {branches: [develop]}
  push:
    branches: [develop, 'feature/**']
  workflow_dispatch:
concurrency:
  group: ci-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
permissions: {contents: read}
jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install XcodeGen
        run: |
          brew install xcodegen
          test "$(xcodegen --version)" = "Version: 2.46.0"
      - name: Toolchain diagnostics
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          swift --version
          xcodegen --version
          xcrun simctl list devices available
      - name: Generate project
        run: xcodegen generate
      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project OFFLINE.xcodeproj -scheme OFFLINE
      - name: Select simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ {print $2; exit}')
          test -n "$DEVICE_ID"
          echo "SIMULATOR_ID=$DEVICE_ID" >> "$GITHUB_ENV"
      - name: Build all test products once
        run: |
          GIT_COMMIT_SHORT="$(git rev-parse --short=7 HEAD)"
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          xcodebuild -project OFFLINE.xcodeproj -scheme OFFLINE -configuration Debug -destination "id=$SIMULATOR_ID" -derivedDataPath build/TestProducts build-for-testing CODE_SIGNING_ALLOWED=NO GIT_COMMIT_SHORT="$GIT_COMMIT_SHORT" BUILD_DATE="$BUILD_DATE" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER"
          TEST_RUN_FILES=(build/TestProducts/Build/Products/*.xctestrun)
          test -f "${TEST_RUN_FILES[0]}"
          echo "TEST_RUN=${TEST_RUN_FILES[0]}" >> "$GITHUB_ENV"
      - name: Focused album and keyboard regressions
        run: |
          xcodebuild -xctestrun "$TEST_RUN" -destination "id=$SIMULATOR_ID" -resultBundlePath build/KeyboardResults.xcresult -only-testing:OFFLINETests/AlbumManagementTests -only-testing:OFFLINETests/ManagedAlbumMigrationTests -only-testing:OFFLINEUITests/LibraryManagementUITests/testSearchTabTransitionClearScrollAndPlaybackKeepNavigationAccessible -test-timeouts-enabled YES -default-test-execution-time-allowance 120 -maximum-test-execution-time-allowance 120 test-without-building
      - name: Compact iPhone library layout
        run: |
          COMPACT_ID=$(xcrun simctl list devices available | awk -F '[()]' '/iPhone SE \(3rd generation\)/ {print $4; exit}')
          test -n "$COMPACT_ID"
          xcodebuild -xctestrun "$TEST_RUN" -destination "id=$COMPACT_ID" -resultBundlePath build/CompactResults.xcresult -only-testing:OFFLINEUITests/LibraryManagementUITests/testLibraryAlbumArtistAndSortingLayouts -only-testing:OFFLINEUITests/LibraryManagementUITests/testSearchSubmitDismissesKeyboardAndCanReopen -only-testing:OFFLINEUITests/LibraryManagementUITests/testEmptyAlbumCreationAndSearchPersistAfterRelaunch -only-testing:OFFLINEUITests/LibraryManagementUITests/testAlbumNameAndArtistSurviveRelaunch -only-testing:OFFLINEUITests/LibraryManagementUITests/testAlbumYearAndDescriptionSurviveRelaunch -test-timeouts-enabled YES -default-test-execution-time-allowance 120 -maximum-test-execution-time-allowance 120 test-without-building
      - name: Export compact screenshots
        if: always()
        run: |
          if [[ -d build/CompactResults.xcresult ]]; then
            xcrun xcresulttool export attachments --path build/CompactResults.xcresult --output-path build/CompactScreenshots
          fi
      - name: Complete regression suite
        run: |
          xcodebuild -xctestrun "$TEST_RUN" -destination "id=$SIMULATOR_ID" -resultBundlePath build/TestResults.xcresult -test-timeouts-enabled YES -default-test-execution-time-allowance 60 -maximum-test-execution-time-allowance 120 test-without-building
      - name: Export UI screenshots
        if: always()
        run: |
          if [[ -d build/TestResults.xcresult ]]; then
            xcrun xcresulttool export attachments --path build/TestResults.xcresult --output-path build/UITestScreenshots
          fi
          if [[ -d build/KeyboardResults.xcresult ]]; then
            xcrun xcresulttool export attachments --path build/KeyboardResults.xcresult --output-path build/KeyboardScreenshots
          fi
      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: library-ui-screenshots
          path: |
            build/UITestScreenshots
            build/CompactScreenshots
            build/KeyboardScreenshots
          if-no-files-found: ignore
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playback-test-results
          path: |
            build/TestResults.xcresult
            build/CompactResults.xcresult
            build/KeyboardResults.xcresult
          if-no-files-found: ignore

