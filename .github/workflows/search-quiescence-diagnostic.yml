name: Search-field XCTest baseline comparison
on:
  push:
    branches: ['diagnostic/search-quiescence-20261108']
permissions: {contents: read}
jobs:
  search-compare:
    name: search-${{ matrix.source }}
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {source: develop, commit: '12db78752cab4e721f61635660a128e093131e18'}
          - {source: phase10, commit: '1de632334a15371dfe7e65d200fd977d63570781'}
    defaults:
      run:
        shell: bash
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      RUNTIME: com.apple.CoreSimulator.SimRuntime.iOS-26-2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.commit }}
      - name: Record exact test source and pinned runtime
        run: |
          set -euo pipefail
          mkdir -p build/evidence
          test "$(git rev-parse HEAD)" = '${{ matrix.commit }}'
          test "$(xcodebuild -version | head -1)" = 'Xcode 26.2'
          git rev-parse HEAD | tee build/evidence/source.txt
          xcodebuild -version
          xcrun simctl list runtimes -j | python3 -c 'import json,sys,os; a=json.load(sys.stdin)["runtimes"]; assert any(x.get("identifier")==os.environ["RUNTIME"] and x.get("isAvailable") for x in a)'
      - name: Compile unchanged app and UI tests
        run: |
          set -euo pipefail
          brew install xcodegen
          test "$(xcodegen --version)" = 'Version: 2.46.0'
          xcodegen generate
          xcodebuild -resolvePackageDependencies -project OFFLINE.xcodeproj -scheme OFFLINE
          xcodebuild -project OFFLINE.xcodeproj -scheme OFFLINE -configuration Debug -destination 'generic/platform=iOS Simulator' -derivedDataPath build/Products build-for-testing CODE_SIGNING_ALLOWED=NO GIT_COMMIT_SHORT="$(git rev-parse --short=7 HEAD)" BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" > build/evidence/build.log 2>&1 || { tail -100 build/evidence/build.log; exit 1; }
      - name: Boot fresh SE simulator
        run: |
          set -euo pipefail
          TYPE="$(xcrun simctl list devicetypes -j | python3 -c 'import json,sys; a=json.load(sys.stdin)["devicetypes"]; print(next(x["identifier"] for x in a if x["name"]=="iPhone SE (3rd generation)"))')"
          ID="$(xcrun simctl create "CI-search-${{ matrix.source }}-$GITHUB_RUN_ID" "$TYPE" "$RUNTIME")"
          echo "SIMULATOR_ID=$ID" >> "$GITHUB_ENV"
          xcrun simctl boot "$ID"
          xcrun simctl bootstatus "$ID" -b
      - name: Run each problematic test twice without retries
        run: |
          set -euo pipefail
          TEST_RUN="$(find build/Products/Build/Products -maxdepth 1 -name '*.xctestrun' -print -quit)"
          test -f "$TEST_RUN"
          FAILED=0
          for SPEC in testSearchSubmitDismissesKeyboardAndCanReopen testAlbumYearAndDescriptionSurviveRelaunch; do
            set +e
            xcodebuild -xctestrun "$TEST_RUN" -destination "id=$SIMULATOR_ID" -parallel-testing-enabled NO -resultBundlePath "build/$SPEC.xcresult" "-only-testing:OFFLINEUITests/LibraryManagementUITests/$SPEC" -test-iterations 2 -test-timeouts-enabled YES -default-test-execution-time-allowance 120 -maximum-test-execution-time-allowance 120 test-without-building > "build/evidence/$SPEC.log" 2>&1
            EXIT=$?
            set -e
            printf '%s exit=%s\n' "$SPEC" "$EXIT" | tee -a build/evidence/outcomes.txt
            grep -E 'App animations complete notification not received|exceeded execution time allowance|Test Case .* (passed|failed)|TEST EXECUTE' "build/evidence/$SPEC.log" | tail -50 || true
            if (( EXIT != 0 )); then FAILED=1; fi
          done
          exit "$FAILED"
      - name: Export diagnostics and test results
        if: always()
        run: |
          mkdir -p build/evidence/exports
          for result in build/*.xcresult; do
            [[ -f "$result/Info.plist" ]] || continue
            label="$(basename "$result" .xcresult)"
            xcrun xcresulttool get test-results summary --path "$result" > "build/evidence/$label-summary.json" || true
            xcrun xcresulttool get test-results tests --path "$result" > "build/evidence/$label-tests.json" || true
            xcrun xcresulttool export diagnostics --path "$result" --output-path "build/evidence/exports/$label" || true
          done
      - name: Preserve comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: search-comparison-${{ matrix.source }}
          path: |
            build/evidence
            build/*.xcresult
          retention-days: 7
          if-no-files-found: warn
      - name: Delete only this job's simulator
        if: always() && env.SIMULATOR_ID != ''
        run: |
          xcrun simctl shutdown "$SIMULATOR_ID" || true
          xcrun simctl delete "$SIMULATOR_ID" || true
